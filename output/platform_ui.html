<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nebula — orbital command</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b0e14;
      color: #e2e8f0;
      height: 100vh;
      overflow: hidden;
      line-height: 1.5;
    }

    /* glassmorphism base */
    .glass {
      background: rgba(20, 25, 35, 0.65);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 0 0 0.5px rgba(255, 255, 255, 0.03);
    }

    /* layout shell */
    .app {
      display: grid;
      grid-template-columns: 260px 1fr 300px;
      grid-template-rows: 1fr;
      height: 100vh;
      gap: 0;
      background: radial-gradient(circle at 20% 10%, #1a2332, #0b0e14 80%);
    }

    /* sidebar (left) */
    .sidebar {
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      margin: 12px 0 12px 12px;
      border-radius: 20px;
      background: rgba(12, 16, 24, 0.7);
      backdrop-filter: blur(14px);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      height: calc(100vh - 24px);
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px 20px;
      font-weight: 600;
      font-size: 1.3rem;
      letter-spacing: -0.5px;
      color: #f0f4ff;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(145deg, #6c8cff, #3a56c0);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 4px 12px rgba(60, 90, 255, 0.3);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      margin: 4px 0;
      border-radius: 12px;
      color: #a7b4cc;
      transition: all 0.2s ease;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.95rem;
    }

    .nav-item:hover {
      background: rgba(90, 120, 255, 0.15);
      color: #ffffff;
      transform: translateX(4px);
    }

    .nav-item.active {
      background: rgba(70, 110, 255, 0.2);
      color: white;
      border-left: 3px solid #6c8cff;
    }

    .nav-spacer {
      flex: 1;
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 10px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      margin-top: 12px;
      transition: background 0.2s;
      position: relative;
    }

    .user-chip:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #9c6fff, #4b3a8f);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
    }

    /* main workspace */
    .main {
      display: flex;
      flex-direction: column;
      padding: 20px 24px;
      gap: 24px;
      overflow-y: auto;
      height: 100vh;
      scrollbar-width: thin;
      scrollbar-color: #3a4255 transparent;
    }

    /* header row */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-title h1 {
      font-size: 1.8rem;
      font-weight: 600;
      background: linear-gradient(120deg, #fff, #b9c8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .page-title p {
      color: #7e8aa5;
      font-size: 0.9rem;
    }

    /* stats cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
    }

    .stat-card {
      padding: 20px 16px;
      border-radius: 18px;
      background: rgba(25, 32, 44, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: all 0.25s;
    }

    .stat-card:hover {
      background: rgba(40, 55, 85, 0.7);
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
    }

    .stat-label {
      color: #7f8ca8;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .stat-value {
      font-size: 2.2rem;
      font-weight: 700;
      margin: 8px 0 4px;
    }

    .stat-trend {
      font-size: 0.8rem;
      color: #6ddf9f;
    }

    /* two-column inner */
    .dashboard-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .project-list, .activity-feed {
      background: rgba(18, 24, 34, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      color: #cfd9f0;
    }

    .project-item {
      display: flex;
      align-items: center;
      padding: 12px 8px;
      border-radius: 12px;
      transition: background 0.2s;
      cursor: default;
    }

    .project-item:hover {
      background: rgba(80, 110, 255, 0.1);
    }

    .project-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #6c8cff;
      margin-right: 14px;
    }

    .activity-item {
      display: flex;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }

    /* chat sidebar (right) */
    .chat-panel {
      margin: 12px 12px 12px 0;
      padding: 16px 12px;
      background: rgba(14, 18, 28, 0.75);
      backdrop-filter: blur(14px);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 24px);
      border-left: 1px solid rgba(255, 255, 255, 0.04);
    }

    .chat-header {
      padding: 8px 8px 16px;
      font-weight: 600;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      justify-content: space-between;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 4px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scrollbar-width: thin;
    }

    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 0.9rem;
      background: #1b2536;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .message.mine {
      background: #2b3a5c;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message.other {
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg-meta {
      font-size: 0.7rem;
      color: #7f8ca8;
      margin-top: 4px;
    }

    .chat-input-area {
      display: flex;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .chat-input-area input {
      flex: 1;
      background: rgba(20, 28, 40, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      padding: 10px 16px;
      color: white;
      outline: none;
      transition: all 0.2s;
    }

    .chat-input-area input:focus {
      border-color: #6c8cff;
      box-shadow: 0 0 0 2px rgba(108, 140, 255, 0.2);
    }

    .send-btn {
      background: #3a56c0;
      border: none;
      border-radius: 30px;
      padding: 0 16px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .send-btn:hover {
      background: #5070e8;
    }

    /* command palette - floating */
    .command-palette {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 999;
      width: 380px;
      background: rgba(18, 24, 34, 0.8);
      backdrop-filter: blur(20px) saturate(160%);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      transform-origin: bottom right;
    }

    .palette-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .palette-header span {
      background: #2a3648;
      padding: 4px 10px;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #aab8d8;
    }

    .palette-input {
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 1rem;
      width: 100%;
    }

    .palette-preview {
      padding: 10px 18px 16px;
      color: #a0b3d9;
      font-size: 0.9rem;
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .palette-actions {
      padding: 8px;
      max-height: 220px;
      overflow-y: auto;
    }

    .palette-action-item {
      padding: 12px 16px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.15s;
      cursor: pointer;
      color: #d0dcf5;
    }

    .palette-action-item:hover {
      background: rgba(100, 130, 255, 0.2);
    }

    .palette-action-item .icon {
      font-size: 1.2rem;
    }

    .palette-footer {
      padding: 12px 18px;
      font-size: 0.7rem;
      color: #6f7d99;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* profile dropdown */
    .profile-menu {
      position: absolute;
      bottom: 70px;
      left: 10px;
      background: rgba(20, 28, 42, 0.9);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 8px;
      min-width: 180px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .user-chip:hover .profile-menu {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .profile-menu div {
      padding: 10px 12px;
      border-radius: 8px;
      color: #cfd9f0;
      font-size: 0.9rem;
      transition: background 0.15s;
    }

    .profile-menu div:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* file manager grid (hidden by default, shown via JS) */
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 16px;
      padding: 12px 0;
    }

    .file-card {
      background: rgba(30, 40, 58, 0.6);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: all 0.2s;
      cursor: default;
    }

    .file-card:hover {
      background: rgba(50, 70, 110, 0.5);
      transform: scale(1.02);
    }

    .file-icon {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    /* hidden class */
    .hidden {
      display: none !important;
    }

    /* responsive */
    @media (max-width: 900px) {
      .app {
        grid-template-columns: 70px 1fr 0px;
      }
      .sidebar .nav-item span, .sidebar .logo-area span, .sidebar .user-chip .user-detail {
        display: none;
      }
      .sidebar {
        padding: 12px 8px;
      }
      .chat-panel {
        display: none;
      }
      .command-palette {
        width: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- LEFT SIDEBAR -->
    <aside class="sidebar glass">
      <div class="logo-area">
        <div class="logo-icon">✦</div>
        <span>Nebula</span>
      </div>
      <div class="nav-item active"><span>📊</span> Dashboard</div>
      <div class="nav-item" id="nav-files"><span>📁</span> Files</div>
      <div class="nav-item"><span>💬</span> Chat</div>
      <div class="nav-item"><span>⚡</span> Activity</div>
      <div class="nav-spacer"></div>
      <div class="user-chip">
        <div class="avatar">AK</div>
        <div class="user-detail" style="flex:1">
          <div style="font-weight:600">Alex Kim</div>
