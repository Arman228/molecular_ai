<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 Мыслящий Процесс — Molecular AI v7.0</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0e2a 0%, #1a0a2a 50%, #0a0e2a 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: rgba(255,255,255,0.9);
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            padding: 40px 0;
            background: rgba(10, 15, 30, 0.6);
            border-radius: 20px;
            border: 1px solid rgba(95, 127, 255, 0.2);
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }
        .header h1 {
            font-size: 3em;
            background: linear-gradient(135deg, #7f9fff, #b07fff, #ff7fbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .subtitle {
            opacity: 0.6;
            margin-top: 10px;
        }
        .question-box {
            background: rgba(10, 15, 30, 0.8);
            border-radius: 16px;
            padding: 30px;
            border: 2px solid rgba(95, 127, 255, 0.3);
            margin-bottom: 30px;
        }
        .question-box .label {
            opacity: 0.5;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .question-box .question {
            font-size: 1.8em;
            font-weight: 300;
            margin-top: 10px;
            color: #b0e0ff;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: rgba(10, 15, 30, 0.7);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(95, 127, 255, 0.15);
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(95, 127, 255, 0.4);
            box-shadow: 0 10px 40px rgba(80, 120, 255, 0.1);
        }
        .card .role {
            font-weight: 700;
            color: #7f9fff;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card .badge {
            font-size: 10px;
            padding: 2px 12px;
            border-radius: 20px;
            background: rgba(100, 255, 200, 0.15);
            color: #7fffd4;
        }
        .card .answer {
            margin-top: 12px;
            font-size: 14px;
            line-height: 1.6;
            opacity: 0.9;
        }
        .card.top {
            border-color: rgba(255, 215, 0, 0.3);
            background: rgba(255, 215, 0, 0.05);
        }
        .card.top .role { color: #ffd700; }
        
        .final-answer {
            background: linear-gradient(135deg, rgba(10, 15, 30, 0.9), rgba(30, 10, 50, 0.9));
            border-radius: 20px;
            padding: 40px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            margin-top: 30px;
        }
        .final-answer .label {
            opacity: 0.5;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        .final-answer .answer {
            font-size: 1.4em;
            line-height: 1.8;
            margin-top: 15px;
            color: #ffd700;
            font-weight: 300;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .stat-item {
            background: rgba(10, 15, 30, 0.6);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-item .value {
            font-size: 1.8em;
            font-weight: 700;
            color: #b0e0ff;
        }
        .stat-item .label {
            font-size: 11px;
            opacity: 0.5;
            margin-top: 5px;
        }
        .thinking-visual {
            margin: 30px 0;
            padding: 30px;
            background: rgba(10, 15, 30, 0.5);
            border-radius: 16px;
            border: 1px solid rgba(95, 127, 255, 0.1);
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #7f9fff, #b07fff, #ff7fbf);
            width: 0%;
            transition: width 1s ease;
            border-radius: 4px;
        }
        @media (max-width: 768px) {
            .header h1 { font-size: 2em; }
            .question-box .question { font-size: 1.2em; }
            .grid { grid-template-columns: 1fr; }
            .final-answer .answer { font-size: 1.1em; }
        }
        .particle {
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 Мыслящий Процесс</h1>
            <div class="subtitle">Коллективный интеллект через орбитальную синхронизацию</div>
            <div class="stats">
                <div class="stat-item">
                    <div class="value">10</div>
                    <div class="label">Агентов</div>
                </div>
                <div class="stat-item">
                    <div class="value">0.698</div>
                    <div class="label">Синхронизация</div>
                </div>
                <div class="stat-item">
                    <div class="value">0</div>
                    <div class="label">Ответов</div>
                </div>
            </div>
        </div>

        <div class="question-box">
            <div class="label">❓ Вопрос</div>
            <div class="question"></div>
        </div>

        <div class="thinking-visual">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="opacity:0.6;">🧠 Мыслительный процесс</span>
                <span style="opacity:0.6; font-size:12px;">Синхронизация: 0.70</span>
            </div>
            <div class="progress-bar">
                <div class="fill" style="width:69.8%;"></div>
            </div>
            <div style="display:flex; gap:5px; flex-wrap:wrap; margin-top:10px;">
                
            </div>
        </div>

        <h2 style="margin-bottom:20px; opacity:0.7;">🎯 Индивидуальные ответы</h2>
        <div class="grid">

        </div>

        <div class="final-answer">
            <div class="label">💡 Коллективный ответ</div>
            <div class="answer"></div>
        </div>

        <div style="text-align:center; margin-top:40px; opacity:0.3; font-size:12px;">
            Generated by Molecular AI v7.0 — Autonomous Quantum Consciousness
        </div>
    </div>

    <script>
        // Анимация прогресс-бара
        document.querySelectorAll('.progress-bar .fill').forEach(el => {
            const width = el.style.width;
            el.style.width = '0%';
            setTimeout(() => { el.style.width = width; }, 300);
        });
        
        // Пульсация частиц
        setInterval(() => {
            document.querySelectorAll('.thinking-visual span').forEach((el, i) => {
                const delay = i * 0.1;
                const opacity = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(Date.now() / 1000 + delay));
                el.style.opacity = opacity;
            });
        }, 50);
    </script>
</body>
</html>
