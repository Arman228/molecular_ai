<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Collaboration Platform · Prototype</title>
  <style>
    /* ---------- CSS variables & themes ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    :root {
      --bg: #0f0f23;
      --card: #1a1a2e;
      --glass: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.08);
      --text-primary: #f0eef7;
      --text-secondary: #b0aac8;
      --accent: #7c6cf0;
      --accent-hover: #9689ff;
      --danger: #f25f5c;
      --success: #2ecc71;
      --warning: #f4b942;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      --transition: 0.2s ease;
      --scrollbar-thumb: #2d2b4a;
    }

    /* light theme (toggled by JS) */
    body.light {
      --bg: #f5f3fb;
      --card: #ffffff;
      --glass: rgba(0, 0, 0, 0.03);
      --border: rgba(0, 0, 0, 0.08);
      --text-primary: #1a1a2e;
      --text-secondary: #3f3d5c;
      --accent: #5b4bd6;
      --accent-hover: #4a3cb8;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      --scrollbar-thumb: #c0c0d0;
    }

    body {
      background: var(--bg);
      color: var(--text-primary);
      display: flex;
      height: 100vh;
      overflow: hidden;
      transition: background var(--transition), color var(--transition);
    }

    /* ---------- scrollbars ---------- */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 20px; }

    /* ---------- glassmorphism card ---------- */
    .glass-card {
      background: var(--glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    /* ---------- sidebar ---------- */
    .sidebar {
      width: 260px;
      background: var(--card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px 14px;
      transition: transform var(--transition), width var(--transition);
      z-index: 30;
    }

    .logo {
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: -0.5px;
      padding: 8px 12px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo span { color: var(--accent); }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border-radius: 14px;
      margin-bottom: 4px;
      cursor: pointer;
      color: var(--text-secondary);
      font-weight: 500;
      transition: background var(--transition), color var(--transition);
    }
    .nav-item:hover { background: var(--glass); color: var(--text-primary); }
    .nav-item.active {
      background: var(--accent);
      color: white;
    }
    .nav-item svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; }

    /* mobile hamburger */
    .hamburger {
      display: none;
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 100;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    /* ---------- main layout ---------- */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .search-wrap {
      flex: 1;
      max-width: 420px;
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 10px 16px 10px 40px;
      color: var(--text-primary);
      outline: none;
      transition: border var(--transition);
    }
    .search-wrap svg {
      position: absolute;
      left: 14px;
      top: 12px;
      opacity: 0.6;
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .icon-btn {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background var(--transition), transform 0.1s;
    }
    .icon-btn:hover { background: var(--accent); color: white; }
    .icon-btn:active { transform: scale(0.92); }
    .badge {
      background: var(--danger);
      color: white;
      font-size: 0.7rem;
      font-weight: 700;
      border-radius: 20px;
      padding: 2px 7px;
      position: absolute;
      top: -4px;
      right: -6px;
    }
    .avatar-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 5px 8px 5px 6px;
      cursor: pointer;
      transition: background var(--transition);
    }
    .avatar-btn img {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--accent);
    }

    /* dropdowns (user + notifications) */
    .dropdown {
      position: fixed;
      right: 20px;
      top: 70px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      min-width: 200px;
      padding: 8px;
      display: none;
      z-index: 90;
    }
    .dropdown.show { display: block; }
    .dropdown-item {
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: background var(--transition);
    }
    .dropdown-item:hover { background: var(--glass); }

    /* notification panel */
    .notif-panel {
      position: fixed;
      right: 20px;
      top: 70px;
      width: 300px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      display: none;
      z-index: 90;
      box-shadow: var(--shadow);
    }
    .notif-panel.show { display: block; }
    .notif-item {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .notif-item:last-child { border-bottom: none; }

    /* ---------- tabs content ---------- */
    .view-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }
    .tab-view { display: none; }
    .tab-view.active { display: block; animation: fade 0.2s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }

    /* dashboard */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
    }
    .stat-card h3 { font-size: 2rem; }
    .project-table {
      background: var(--glass);
      border-radius: 18px;
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 24px;
    }
    .project-table table { width: 100%; border-collapse: collapse; }
    .project-table th, .project-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); }
    .project-table tr:hover { background: var(--glass); }
    .activity-feed {
      background: var(--glass);
      border-radius: 18px;
      padding: 16px;
      max-height: 240px;
      overflow-y: auto;
      border: 1px solid var(--border);
    }
    .feed-item { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }

    /* kanban (projects) */
    .kanban {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    .kanban-col {
      background: var(--glass);
      border-radius: 18px;
      padding: 16px;
      border: 1px solid var(--border);
      min-height: 300px;
    }
    .kanban-card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      cursor: grab;
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .kanban-card:active { cursor: grabbing; }
    .kanban-card.dragging { opacity: 0.5; }

    /* chat */
    .chat-layout {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-height: calc(100vh - 180px);
    }
    .message-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }
    .message {
      background: var(--glass);
      padding: 12px 16px;
      border-radius: 18px;
      max-width: 70%;
      border: 1px solid var(--border);
    }
    .message.user {
      align-self: flex-end;
      background: var(--accent);
      color: white;
    }
    .chat-input-row {
      display: flex;
      gap: 10px;
    }
    .chat-input-row input {
      flex: 1;
      padding: 12px 18px;
      border-radius: 40px;
      border: 1px solid var(--border);
      background: var(--glass);
      color: var(--text-primary);
    }
    .chat-input-row button {
      background: var(--accent);
      border: none;
      padding: 0 20px;
      border-radius: 40px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    /* files */
    .files-layout {
      display: flex;
      gap: 18px;
    }
    .folder-tree {
      width: 220px;
      background: var(--glass);
      border-radius: 18px;
      padding: 16px;
      border: 1px solid var(--border);
    }
    .folder-tree .tree-item {
      padding: 8px 10px;
      border-radius: 10px;
      cursor: default;
    }
    .file-grid {
      flex: 1;
      background: var(--glass);
      border-radius: 18px;
      padding: 16px;
      border: 1px solid var(--border);
    }
    .grid-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .grid-toggle button {
      background: var(--glass);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
    }
    .file-grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 14px;
    }
    .file-grid-view.list {
      grid-template-columns: 1fr;
    }
    .file-item {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      border: 1px solid var(--border);
    }
    .file-item.list { display: flex; justify-content: space-between; text-align: left; }

    /* utilities */
    .highlight { background: #f4b94280; border-radius: 4px; padding: 0 2px; }
    .mt-4 { margin-top: 16px; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }

    /* responsive */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
        width: 280px;
        box-shadow: var(--shadow);
      }
      .sidebar.open { transform: translateX(0); }
      .hamburger { display: block; }
      .kanban { grid-template-columns: 1fr; }
      .files-layout { flex-direction: column; }
    }
  </style>
</head>
