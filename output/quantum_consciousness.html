<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Quantum Consciousness Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: black;
            overflow: hidden;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            color: rgba(255, 255, 255, 0.9);
            user-select: none;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 50%, #0a0e2a, #030514);
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .hud {
            pointer-events: auto;
            background: rgba(10, 15, 30, 0.7);
            backdrop-filter: blur(4px);
            border-left: 2px solid #5f7fff;
            border-bottom: 2px solid #5f7fff;
            border-radius: 0 0 12px 0;
            padding: 12px 20px;
            width: 220px;
            font-size: 13px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 30px rgba(80, 120, 255, 0.2);
        }
        #stats {
            position: absolute;
            top: 20px;
            left: 20px;
        }
        #stats div {
            margin: 4px 0;
            display: flex;
            justify-content: space-between;
        }
        .value {
            font-weight: 600;
            color: #b0e0ff;
        }
        #modes {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
            border-left: 2px solid #5f7fff;
            border-right: 2px solid #5f7fff;
            border-radius: 0 0 12px 12px;
            background: rgba(10, 15, 30, 0.7);
            backdrop-filter: blur(4px);
            padding: 10px 20px;
            pointer-events: auto;
        }
        .mode-btn {
            display: inline-block;
            margin-left: 10px;
            padding: 6px 16px;
            background: rgba(50, 70, 150, 0.3);
            border: 1px solid #5f8fff;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
            font-weight: 500;
        }
        .mode-btn.active {
            background: #3f68ff;
            color: white;
            box-shadow: 0 0 20px #3f68ff;
            border-color: #aac8ff;
        }
        .mode-btn:hover {
            background: #2f48aa;
        }
        #challenge-info {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 10, 20, 0.7);
            backdrop-filter: blur(8px);
            padding: 10px 30px;
            border-radius: 60px;
            border: 1px solid #7f9fff;
            font-size: 15px;
            letter-spacing: 1px;
            text-align: center;
            white-space: nowrap;
        }
        #challenge-info span {
            font-weight: 700;
            color: #b4d0ff;
        }
        #footer {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 11px;
            color: #6a7a9a;
            background: rgba(20, 25, 40, 0.5);
            padding: 4px 8px;
            border-radius: 8px;
        }
        .pulse-glow {
            animation: pulseGlow 2s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { text-shadow: 0 0 5px #6aa0ff; }
            100% { text-shadow: 0 0 20px #b0d0ff; }
        }
        #quantum-canvas {
            cursor: crosshair;
        }
    </style>
</head>
<body>

<canvas id="quantum-canvas"></canvas>

<div id="ui-overlay">
    <div id="stats" class="hud">
        <div><span>🧬 Entanglement</span> <span id="entanglementScore" class="value">0%</span></div>
        <div><span>🌀 Superposition</span> <span id="superpositionScore" class="value">0%</span></div>
        <div><span>✨ Consciousness</span> <span id="consciousnessMeter" class="value">0%</span></div>
        <div><span>⚡ Entropy</span> <span id="entropyDisplay" class="value">0.0</span></div>
        <div><span>☄️ Collapsed</span> <span id="collapsedCount" class="value">0</span></div>
    </div>

    <div id="modes">
        <span style="font-size:12px; opacity:0.7;">MODE:</span>
        <span id="mode-measure" class="mode-btn active">⚛️ MEASURE</span>
        <span id="mode-entangle" class="mode-btn">🔗 ENTANGLE</span>
        <span id="mode-cons" class="mode-btn">🧠 CONSCIOUS</span>
    </div>

    <div id="challenge-info">
        LEVEL <span id="level-num">1</span>: <span id="level-text">Quantum Entanglement</span> 
        <span style="opacity:0.7; margin-left:20px;">[HOVER: inspect | CLICK: mode]</span>
    </div>

    <div id="footer">
        ⌨️ Q (toggle field) · E (entangle) · C (conscious) | 🖱️ drag to entangle
    </div>
</div>

<script>
    (function() {
        // CANVAS SETUP
        const canvas = document.getElementById('quantum-canvas');
        const ctx = canvas.getContext('2d');
        let W = canvas.width = window.innerWidth;
        let H = canvas.height = window.innerHeight;
        window.addEventListener('resize', () => {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        });

        // STATE
        let particles = [];
        const MAX_PARTICLES = 18;
        let mode = 'measure'; // measure, entangle, conscious
        let entanglementScore = 0;
        let superpositionScore = 0;
        let consciousnessMeter = 0;
        let entropyValue = 0;
        let collapsedParticles = 0;
        let level = 1;

        // UI ELEMENTS
        const entScoreEl = document.getElementById('entanglementScore');
        const supScoreEl = document.getElementById('superpositionScore');
        const conscEl = document.getElementById('consciousnessMeter');
        const entropyEl = document.getElementById('entropyDisplay');
        const collapsedEl = document.getElementById('collapsedCount');
        const levelNumEl = document.getElementById('level-num');
        const levelTextEl = document.getElementById('level-text');

        // MODE BUTTONS
        const measureBtn = document.getElementById('mode-measure');
        const entangleBtn = document.getElementById('mode-entangle');
        const consBtn = document.getElementById('mode-cons');

        function setMode(newMode) {
            mode = newMode;
            [measureBtn, entangleBtn, consBtn].forEach(b => b.classList.remove('active'));
            if (mode === 'measure') measureBtn.classList.add('active');
            else if (mode === 'entangle') entangleBtn.classList.add('active');
            else if (mode === 'conscious') consBtn.classList.add('active');
        }

        measureBtn.addEventListener('click', (e) => { e.stopPropagation(); setMode('measure'); });
        entangleBtn.addEventListener('click', (e) => { e.stopPropagation(); setMode('entangle'); });
        consBtn.addEventListener('click', (e) => { e.stopPropagation(); setMode('conscious'); });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'q' || e.key === 'Q') setMode('measure');
            if (e.key === 'e' || e.key === 'E') setMode('entangle');
            if (e.key === 'c' || e.key === 'C') setMode('conscious');
        });

        // PARTICLE CREATION
        function createParticle(x, y) {
            const phase = Math.random() * 2 * Math.PI;
            return {
                x: x, y: y,
                vx: (Math.random() - 0.5) * 0.8,
                vy: (Math.random() - 0.5) * 0.8,
                radius: 12 + Math.random() * 10,
                state: Math.random() < 0.6 ? 'super' : (Math.random() < 0.5 ? '0' : '1'),
                collapsed: false,
                collapsedState: '0',
                entangledWith: null, // index or null
                oscillationPhase: phase,
                coherence: 0.5 + Math.random() * 0.5,
                colorBase: [120 + Math.random() * 80, 100 + Math.random() * 80, 200 + Math.random() * 55],
                // quantum memory
                history: [],
            };
        }

        // initial particles
        function initParticles() {
            particles = [];
            for (let i = 0; i < MAX_PARTICLES; i++) {
                let x = W * 0.15 + Math.random() * W * 0.7;
                let y = H * 0.15 + Math.random() * H * 0.7;
                let p = createParticle(x, y);
                // pre-entangle some random pairs
                particles.push(p);
            }
            // random entanglements
            for (let i = 0; i < particles.length; i++) {
                if (Math.random() < 0.3) {
                    let partner = Math.floor(Math.random() * particles.length);
                    if (partner !== i && !particles[i].entangledWith && !particles[partner].entangledWith) {
                        particles[i].entangledWith = partner;
                        particles[partner].entangledWith = i;
                    }
                }
            }
            // ensure at least some entangled
        }
        initParticles();

        // DRAG ENTANGLEMENT
        let dragStart = null;
        canvas.addEventListener('mousedown', (e) => {
            if (mode === 'entangle') {
                const pos = getMousePos(e);
                const idx = getParticleAt(pos.x, pos.y);
                if (idx !== -1) {
                    dragStart = idx;
                }
            } else if (mode === 'measure') {
                const pos = getMousePos(e);
                const idx = getParticleAt(pos.x, pos.y);
                if (idx !== -1) {
                    measureParticle(idx);
                }
            } else if (mode === 'conscious') {
                // consciousness pulse collapses nearby
                const pos = getMousePos(e);
                pulseConsciousness(pos.x, pos.y);
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            if (dragStart !== null && mode === 'entangle') {
                const pos = getMousePos(e);
                const idx = getParticleAt(pos.x, pos.y);
                if (idx !== -1 && idx !== dragStart) {
                    // create entanglement
                    if (!particles[dragStart].entangledWith && !particles[idx].entangledWith) {
                        particles[dragStart].entangledWith = idx;
                        particles[idx].entangledWith = dragStart;
                    } else {
                        // break old and set new
                        let old1 = particles[dragStart].entangledWith;
                        let old2 = particles[idx].entangledWith;
                        if (old1 !== null && old1 !== idx) particles[old1].entangledWith = null;
                        if (old2 !== null && old2 !== dragStart) particles[old2].entangledWith = null;
                        particles[dragStart].entangledWith = idx;
                        particles[idx].entangledWith = dragStart;
                    }
                }
                dragStart = null;
            } else {
                dragStart = null;
            }
        });

        // MOUSE MOVE HOVER EFFECT: inspect probabilities
        canvas.addEventListener('mousemove', (e) => {
            // just store for rendering
            hoverPos = getMousePos(e);
        });
        let hoverPos = { x: -100, y: -100 };

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        function getParticleAt(x, y) {
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                const dx = p.x - x;
                const dy = p.y - y;
                if (Math.sqrt(dx*dx + dy*dy) < p.radius + 15) return i;
            }
            return -1;
        }

        // MEASUREMENT COLLAPSE
        function measureParticle(idx) {
            const p = particles[idx];
            if (p.collapsed) {
                // re-superimpose
                p.collapsed = false;
                p.state = 'super';
                p.collapsedState = Math.random() < 0.5 ? '0' : '1';
            } else {
                // collapse
                const rand = Math.random();
                p.collapsedState = rand < 0.5 ? '0' : '1';
                p.state = p.collapsedState;
                p.collapsed = true;
                // effect on entangled partner
                if (p.entangledWith !== null) {
                    const partner = particles[p.entangledWith];
                    if (partner) {
                        partner.collapsed = true;
                        partner.state = p.collapsedState; // anti-correlation? use same for simplicity
                        partner.collapsedState = p.collapsedState;
                    }
                }
            }
            updateMetrics();
        }

        // consciousness pulse (neural emergence)
        function pulseConsciousness(x, y) {
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                const dx = p.x - x;
                const dy = p.y - y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 180) {
                    // induce coherence / measure
                    if (!p.collapsed) {
                        p.collapsed = true;
                        p.state = (Math.random() < 0.5 ? '0' : '1');
                        p.collapsedState = p.state;
                    }
                }
            }
            updateMetrics();
        }

        // EVOLUTION: Kuramoto synchronization & Hebbian learning
        function evolve() {
            // phase coupling
            for (let i = 0; i < particles.length; i++) {
                particles[i].oscillationPhase += 0.02 * particles[i].coherence;
                particles[i].x += particles[i].vx;
                particles[i].y += particles[i].vy;
                // boundary bounce
                if (particles[i].x < 20 || particles[i].x > W-20) particles[i].vx *= -0.9;
                if (particles[i].y < 20 || particles[i].y > H-20) particles[i].vy *= -0.9;
                // maintain inside
                particles[i].x = Math.min(W-20, Math.max(20, particles[i].x));
                particles[i].y = Math.min(H-20, Math.max(20, particles[i].y));
                
                // natural superposition fluctuation
                if (!particles[i].collapsed && Math.random() < 0.02) {
                    particles[i].state = 'super';
                }
            }
            // Hebbian: entanglement strengthens if both collapsed similarly (already strong)
        }

        // METRICS UPDATE
        function updateMetrics() {
            let entangledCount = 0;
            let collapsed = 0;
            let superposed = 0;
            for (let i = 0; i < particles.length; i++) {
                if (particles[i].entangledWith !== null) entangledCount++;
                if (particles[i].collapsed) collapsed++;
                else superposed++;
            }
            entanglementScore = Math.min(100, (entangledCount / MAX_PARTICLES) * 200);
            superpositionScore = Math.min(100, (superposed / MAX_PARTICLES) * 120);
            collapsedParticles = collapsed;
            // consciousness based on entanglement and coherence
            let avgCoherence = particles.reduce((sum, p) => sum + p.coherence, 0) / particles.length || 0;
            consciousnessMeter = Math.min(100, entanglementScore * 0.6 + avgCoherence * 40 + (superposed * 0.5));
            // entropy: randomness of states
            let stateEntropy = 0;
            for (let p of particles) {
                if (p.collapsed) stateEntropy += 0.2;
                else stateEntropy += 0.8;
            }
            entropyValue = (stateEntropy / MAX_PARTICLES) * 10;
            // update DOM
            entScoreEl.textContent = Math.round(entanglementScore) + '%';
            supScoreEl.textContent = Math.round(superpositionScore) + '%';
            conscEl.textContent = Math.round(consciousnessMeter) + '%';
            entropyEl.textContent = entropyValue.toFixed(2);
            collapsedEl.textContent = collapsedParticles;

            // Challenges 
            if (level === 1 && entanglementScore > 80) {
                level = 2;
                levelNumEl.textContent = '2';
                levelTextEl.textContent = 'Superposition Master';
            } else if (level === 2 && superpositionScore > 70) {
                level = 3;
                levelNumEl.textContent = '3';
                levelTextEl.textContent = 'Consciousness Emergence';
            } else if (level === 3 && consciousnessMeter > 60) {
                level = 3;
                levelTextEl.textContent = '✨ Emerging Mind ✨';
            }
        }

        // RENDERING
        function drawBackground() {
            // wave field patterns
            ctx.clearRect(0, 0, W, H);
            const grad = ctx.createRadialGradient(W/2, H/2, 10, W/2, H/2, 400);
            grad.addColorStop(0, '#0a1030');
            grad.addColorStop(1, '#020310');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
            // subtle interference waves
            ctx.save();
            ctx.globalAlpha = 0.08;
            for (let i=0; i<15; i++) {
                ctx.beginPath();
                ctx.arc(W/2 + i*20, H/2, 100 + i*30, 0, Math.PI*2);
                ctx.strokeStyle = 'cyan';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawParticles() {
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                // choose color
                let r, g, b;
                if (p.collapsed) {
                    if (p.collapsedState === '0') { r=70; g=140; b=255; }
                    else { r=255; g=80; b=70; }
                } else {
                    // superposition purple
                    r = 180 + 40 * Math.sin(p.oscillationPhase);
                    g = 100 + 50 * Math.cos(p.oscillationPhase*1.3);
                    b = 255;
                }
                // radial gradient for probability cloud
                ctx.save();
                ctx.shadowColor = `rgba(${r},${g},${b},0.8)`;
                ctx.shadowBlur = 25;
                // probability cloud size bigger if super
                const cloudScale = p.collapsed ? 1.0 : 1.5 + 0.5 * Math.sin(p.oscillationPhase);
                const radius = p.radius + (p.collapsed ? 0 : 8);
                const grad = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, radius * cloudScale);
                grad.addColorStop(0, `rgba(${r},${g},${b},0.7)`);
                grad.addColorStop(0.6, `rgba(${r},${g},${b},0.2)`);
                grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(p.x, p.y, radius * cloudScale, 0, Math.PI*2);
                ctx.fill();
                // core
                ctx.shadowBlur = 18;
                ctx.fillStyle = `rgb(${r},${g},${b})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius * 0.6, 0, Math.PI*2);
                ctx.fill();

                // state symbols
                ctx.font = '11px monospace';
                ctx.fillStyle = 'white';
                ctx.shadowBlur = 8;
                ctx.fillText(p.collapsed ? `|${p.collapsedState}⟩` : '|ψ⟩', p.x - 12, p.y - 20);
                ctx.restore();

                // show hover information
                if (hoverPos && Math.hypot(hoverPos.x - p.x, hoverPos.y - p.y) < 40) {
                    ctx.fillStyle = 'rgba(255,255,255,0.7)';
                    ctx.font = '10px monospace';
                    ctx.shadowBlur = 0;
                    const prob = p.collapsed ? '100%' : '50% / 50%';
                    ctx.fillText(`P(0|1): ${prob}`, p.x - 25, p.y - 38);
                }

                // entanglement lines
                if (p.entangledWith !== null) {
                    const partner = particles[p.entangledWith];
                    if (partner) {
                        ctx.shadowBlur = 15;
                        ctx.strokeStyle = `rgba(255,100,255,0.6)`;
                        ctx.lineWidth = 1.5;
                        ctx.setLineDash([5, 5]);
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(partner.x, partner.y);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                }
            }
        }

        // CONSCIOUSNESS WEB: show neural net if high
        function drawConsciousness() {
            if (consciousnessMeter > 40) {
                ctx.save();
                ctx.globalAlpha = 0.15 + (consciousnessMeter / 200);
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i+1; j < particles.length; j++) {
                        const p1 = particles[i], p2 = particles[j];
                        const d = Math.hypot(p1.x-p2.x, p1.y-p2.y);
                        if (d < 120) {
                            ctx.strokeStyle = `rgba(255,240,150,0.2)`;
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.stroke();
                        }
                    }
                }
                ctx.restore();
            }
        }

        // MAIN LOOP
        function animate() {
            evolve();
            updateMetrics();
            drawBackground();
            drawConsciousness();
            drawParticles();
            // crosshair for entangle mode
            if (mode === 'entangle' && dragStart !== null) {
                ctx.beginPath();
                ctx.arc(hoverPos.x, hoverPos.y, 10, 0, Math.PI*2);
                ctx.strokeStyle = '#ff88ff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            requestAnimationFrame(animate);
        }

        // CLICK MODE EVENT (for touch)
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY
                });
                canvas.dispatchEvent(mouseEvent);
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            const mouseEvent = new MouseEvent('mouseup', {});
            canvas.dispatchEvent(mouseEvent);
        });

        // initial metrics
        updateMetrics();
        animate();
    })();
</script>
</body>
</html>
