        // ===== КЛАСС ДЛЯ УПРАВЛЕНИЯ ОКНАМИ =====
        class WindowManager {
            constructor() {
                this.windows = {};
                this.zIndex = 100;
                this.openWindows = [];
            }

            // Создание нового окна
            createWindow(id, title, content, icon) {
                // Удаляем старое окно если существует
                if (this.windows[id]) {
                    this.closeWindow(id);
                }

                const windowEl = document.createElement('div');
                windowEl.className = 'window';
                windowEl.id = `window-${id}`;
                windowEl.innerHTML = `
                    <div class="window-header">
                        <span class="window-title">${icon} ${title}</span>
                        <div class="window-controls">
                            <button class="window-btn" onclick="windowManager.minimizeWindow('${id}')">—</button>
                            <button class="window-btn" onclick="windowManager.maximizeWindow('${id}')">□</button>
                            <button class="window-btn window-close" onclick="windowManager.closeWindow('${id}')">✕</button>
                        </div>
                    </div>
                    <div class="window-content">
                        ${content}
                    </div>
                `;

                // Позиционирование окна
                const x = 50 + Math.random() * (window.innerWidth - 400);
                const y = 50 + Math.random() * (window.innerHeight - 400);
                windowEl.style.left = `${x}px`;
                windowEl.style.top = `${y}px`;
                windowEl.style.zIndex = this.zIndex++;

                // Добавляем окно на рабочий стол
                document.getElementById('desktop').appendChild(windowEl);
                windowEl.style.display = 'block';

                // Сохраняем окно
                this.windows[id] = windowEl;
                this.openWindows.push(id);

                // Добавляем функцию перетаскивания
                this.makeDraggable(windowEl);

                // Обновляем панель задач
                this.updateTaskbar();

                return windowEl;
            }

            // Перетаскивание окна
            makeDraggable(windowEl) {
                const header = windowEl.querySelector('.window-header');
                let isDragging = false;
                let currentX;
                let currentY;

                header.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    currentX = e.clientX - windowEl.offsetLeft;
                    currentY = e.clientY - windowEl.offsetTop;
                    windowEl.style.zIndex = this.zIndex++;
                });

                document.addEventListener('mousemove', (e) => {
                    if (isDragging) {
                        const x = e.clientX - currentX;
                        const y = e.clientY - currentY;
                        windowEl.style.left = `${x}px`;
                        windowEl.style.top = `${y}px`;
                    }
                });

                document.addEventListener('mouseup', () => {
                    isDragging = false;
                });
            }

            // Закрытие окна
            closeWindow(id) {
                if (this.windows[id]) {
                    this.windows[id].remove();
                    delete this.windows[id];
                    this.openWindows = this.openWindows.filter(w => w !== id);
                    this.updateTaskbar();
                }
            }

            // Сворачивание окна
            minimizeWindow(id) {
                if (this.windows[id]) {
                    this.windows[id].style.display = 'none';
                }
            }

            // Разворачивание окна
            maximizeWindow(id) {
                if (this.windows[id]) {
                    const win = this.windows[id];
                    if (win.style.width === '100%') {
                        win.style.width = 'auto';
                        win.style.height = 'auto';
                    } else {
                        win.style.width = '100%';
                        win.style.height = '100%';
                    }
                }
            }

            // Восстановление окна
            restoreWindow(id) {
                if (this.windows[id]) {
                    this.windows[id].style.display = 'block';
                    this.windows[id].style.zIndex = this.zIndex++;
                }
            }

            // Обновление панели задач
            updateTaskbar() {
                const taskbarApps = document.getElementById('taskbar-apps');
                taskbarApps.innerHTML = '';

                this.openWindows.forEach(id => {
                    const app = document.createElement('div');
                    app.className = 'taskbar-app';
                    app.innerHTML = id;
                    app.onclick = () => this.restoreWindow(id);
                    taskbarApps.appendChild(app);
                });
            }
        }

        // ===== ФУНКЦИИ ПРИЛОЖЕНИЙ =====

        // Открытие приложения
        function openApp(appId) {
            const config = appConfigs[appId];
            if (!config) return;

            // Инициализация специальных приложений
            if (appId === 'calendar') {
                setTimeout(() => initCalendar(), 100);
            }
            if (appId === 'terminal') {
                setTimeout(() => initTerminal(), 100);
            }

            windowManager.createWindow(appId, config.title, config.content, config.icon);
            hideStartMenu();
        }

        // ===== КАЛЬКУЛЯТОР =====
        let calcExpression = '';

        function calcInput(num) {
            const display = document.getElementById('calc-display');
            if (display.value === '0') {
                display.value = num;
            } else {
                display.value += num;
            }
            calcExpression += num;
        }

        function calcOperator(op) {
            const display = document.getElementById('calc-display');
            if (display.value !== '0') {
                display.value += ` ${op} `;
                calcExpression += ` ${op} `;
            }
        }

        function calcClear() {
            const display = document.getElementById('calc-display');
            display.value = '0';
            calcExpression = '';
        }

        function calcCalculate() {
            try {
                const result = eval(calcExpression);
                document.getElementById('calc-display').value = result;
                calcExpression = String(result);
            } catch (e) {
                document.getElementById('calc-display').value = 'Ошибка';
            }
        }

        // ===== ТЕКСТОВЫЙ РЕДАКТОР =====
        function saveEditor() {
            const text = document.getElementById('editor-text').value;
            localStorage.setItem('editor-content', text);
            showNotification('Сохранено', 'Текст сохранен в памяти!');
        }

        function clearEditor() {
            document.getElementById('editor-text').value = '';
        }

        // ===== БРАУЗЕР =====
        function navigate() {
            const url = document.getElementById('url-input').value;
            const browserView = document.getElementById('browser-view');
            
            if (url.includes('youtube')) {
                browserView.innerHTML = '<iframe width="100%" height="200" src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allowfullscreen></iframe>';
            } else if (url.includes('google')) {
                browserView.innerHTML = '<h3>Google</h3><p>Поисковая система</p><input type="text" placeholder="Поиск..."><button>Найти</button>';
            } else {
                browserView.innerHTML = `<h3>Страница: ${url}</h3><p>Страница не найдена. Попробуйте другой URL.</p>`;
            }
        }

        // ===== МУЗЫКАЛЬНЫЙ ПЛЕЕР =====
        let currentTrack = 0;
        const tracks = ['Track 1', 'Track 2', 'Track 3', 'Track 4'];

        function playerControl(action) {
            switch(action) {
                case 'play':
                    showNotification('Музыка', '▶️ Воспроизведение...');
                    break;
                case 'pause':
                    showNotification('Музыка', '⏸️ Пауза');
                    break;
                case 'next':
                    currentTrack = (currentTrack + 1) % tracks.length;
                    document.getElementById('current-track').textContent = tracks[currentTrack];
                    break;
                case 'prev':
                    currentTrack = (currentTrack - 1 + tracks.length) % tracks.length;
                    document.getElementById('current-track').textContent = tracks[currentTrack];
                    break;
            }
        }
