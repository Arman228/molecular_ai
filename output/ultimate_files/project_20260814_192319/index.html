<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подземелье героя · тёмная RPG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Candara', system-ui, sans-serif;
        }
        body {
            background: #0d0f14;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            color: #d4cfc0;
        }
        .game-wrapper {
            background: #171a21;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 0 20px #2a2e3a;
            padding: 20px;
            max-width: 1200px;
            width: 100%;
            border: 1px solid #3e3f4a;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            background: #1e212b;
            border-radius: 16px;
            padding: 12px 20px;
            border-left: 6px solid #8a6d3b;
        }
        .title {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #b8860b;
            color: #f0dab0;
        }
        .class-selector {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .class-btn {
            background: #252a36;
            border: 1px solid #4a4f5c;
            color: #ddd;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .class-btn.active {
            background: #8a6d3b;
            border-color: #f0c060;
            color: #1a1a1a;
            box-shadow: 0 0 12px #f0b040;
        }
        .save-btns button {
            background: #2b313f;
            border: 1px solid #5b6170;
            color: #e6e6e6;
            padding: 6px 12px;
            border-radius: 20px;
            margin-left: 8px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .save-btns button:hover {
            background: #3d4557;
        }
        .game-layout {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .main-area {
            flex: 3;
            min-width: 280px;
        }
        .side-panel {
            flex: 1.2;
            min-width: 240px;
            background: #1b1e28;
            border-radius: 20px;
            padding: 16px;
            border: 1px solid #3a3e4a;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .dungeon-map {
            background: #0f1118;
            border-radius: 20px;
            padding: 10px;
            border: 2px solid #2f343f;
            position: relative;
            box-shadow: inset 0 0 30px #00000055;
            min-height: 380px;
            display: flex;
            flex-direction: column;
        }
        .minimap {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 100px;
            height: 100px;
            background: #1d1f2a;
            border: 2px solid #6a5c3a;
            border-radius: 12px;
            opacity: 0.9;
            z-index: 5;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 2px;
            padding: 4px;
        }
        .minimap div {
            background: #2c2f3b;
            border-radius: 3px;
        }
        .minimap .room {
            background: #4b4030;
        }
        .minimap .corridor {
            background: #5a5f6e;
        }
        .minimap .player {
            background: #c9a65a;
            box-shadow: 0 0 6px gold;
        }
        .minimap .enemy {
            background: #a33;
        }
        .combat-log {
            background: #212531;
            border-radius: 16px;
            padding: 12px;
            height: 100px;
            overflow-y: auto;
            font-size: 0.85rem;
            border: 1px solid #3d4455;
            margin-top: 8px;
        }
        .stats {
            background: #242a38;
            padding: 12px;
            border-radius: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            border: 1px solid #4a5368;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            font-weight: bold;
        }
        .stat-label {
            font-size: 0.7rem;
            color: #aab2c5;
        }
        .stat-value {
            font-size: 1.2rem;
            color: #f2e6c9;
        }
        .hp-mp-bar {
            display: flex;
            gap: 14px;
        }
        .bar {
            height: 10px;
            background: #3a2a2a;
            border-radius: 20px;
            width: 120px;
            overflow: hidden;
        }
        .hp-fill {
            height: 100%;
            background: #b33030;
            width: 100%;
        }
        .mp-fill {
            height: 100%;
            background: #2a5c9e;
            width: 100%;
        }
        .inventory {
            background: #20242f;
            border-radius: 16px;
            padding: 10px;
        }
        .inv-items {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .inv-item {
            background: #2d323f;
            padding: 6px 10px;
            border-radius: 30px;
            font-size: 0.8rem;
            border: 1px solid #565e70;
        }
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
            justify-content: center;
        }
        .action-btn {
            background: #3a2f22;
            border: 1px solid #a9824a;
            color: #f3d9a4;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 4px 0 #1f1a12;
            flex: 1 1 120px;
        }
        .action-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1f1a12;
        }
        .action-btn:disabled {
            opacity: 0.5;
            transform: none;
        }
        .enemy-area {
            background: #1c1e26;
            border-radius: 20px;
            padding: 12px;
            text-align: center;
            border: 1px solid #5a3e2e;
        }
        .enemy-card {
            background: #2a2e3a;
            padding: 10px;
            border-radius: 20px;
            margin: 6px 0;
        }
        .enemy-hp {
            height: 8px;
            background: #272b32;
            border-radius: 12px;
            margin-top: 6px;
        }
        .enemy-hp-fill {
            height: 100%;
            background: #b33e3e;
            width: 100%;
            border-radius: 12px;
            transition: 0.2s;
        }
        .game-message {
            background: #10121a;
            padding: 8px;
            border-radius: 30px;
            text-align: center;
            font-style: italic;
            color: #b8b294;
        }
        .floor-badge {
            font-size: 0.9rem;
            background: #3b3e4a;
            padding: 4px 14px;
            border-radius: 30px;
        }
        @media (max-width: 800px) {
            .game-layout { flex-direction: column; }
            .side-panel { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="header">
        <span class="title">⚔️ Подземелье героя</span>
        <div class="class-selector" id="classSelector">
            <button class="class-btn active" data-class="warrior">🗡️ Воин</button>
            <button class="class-btn" data-class="mage">🔮 Маг</button>
            <button class="class-btn" data-class="archer">🏹 Лучник</button>
        </div>
        <div class="save-btns">
            <button id="saveBtn">💾 Сохранить</button>
            <button id="loadBtn">📂 Загрузить</button>
        </div>
    </div>

    <div class="game-layout">
        <div class="main-area">
            <div class="dungeon-map" id="dungeonMap">
                <div class="minimap" id="minimap"></div>
                <!-- тут динамически рисуются комнаты, враги, игрок -->
                <div style="position: relative; height: 100%; min-height: 320px;" id="renderZone"></div>
                <div class="game-message" id="gameMessage">🌑 Ты входишь в подземелье...</div>
            </div>
            <div class="action-bar">
                <button class="action-btn" id="exploreBtn">🚶 Исследовать</button>
                <button class="action-btn" id="attackBtn">⚔️ Атака</button>
                <button class="action-btn" id="potionBtn">🧪 Зелье</button>
                <button class="action-btn" id="restBtn">✨ Отдых</button>
            </div>
        </div>

        <div class="side-panel">
            <div class="stats">
                <div class="stat-item"><span class="stat-label">Уровень</span><span class="stat-value" id="levelVal">1</span></div>
                <div class="stat-item"><span class="stat-label">Опыт</span><span class="stat-value" id="expVal">0/100</span></div>
                <div class="stat-item"><span class="stat-label">Класс</span><span class="stat-value" id="classVal">Воин</span></div>
                <div class="hp-mp-bar">
                    <div><span class="stat-label">HP</span><div class="bar"><div class="hp-fill" id="hpBar"></div></div><span id="hpText">30/30</span></div>
                    <div><span class="stat-label">MP</span><div class="bar"><div class="mp-fill" id="mpBar"></div></div><span id="mpText">10/10</span></div>
                </div>
            </div>

            <div class="enemy-area" id="enemyArea">
                <div><span style="opacity:0.8;">👹 Враг</span></div>
                <div id="enemyCard">— нет врага —</div>
            </div>

            <div class="inventory">
                <strong>🎒 Инвентарь</strong>
                <div class="inv-items" id="inventoryList">
                    <span class="inv-item">🧪 Зелье x3</span>
                    <span class="inv-item">🗡️ Стальн. меч</span>
                    <span class="inv-item">🛡️ Кожаная броня</span>
                </div>
            </div>

            <div class="floor-badge" id="floorBadge">Этаж 1</div>

            <div class="combat-log" id="combatLog">
                <div>Добро пожаловать в бездну.</div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ================= КЛАССЫ, СОСТОЯНИЕ =================
        const CLASS_DATA = {
            warrior: { name: 'Воин', hp: 38, mp: 12, atk: 8, def: 3 },
            mage:    { name: 'Маг', hp: 26, mp: 24, atk: 6, def: 1 },
            archer:  { name: 'Лучник', hp: 30, mp: 16, atk: 9, def: 2 }
        };

        const ENEMY_TYPES = [
            { name: 'Гоблин', hp: 18, atk: 5, xp: 25, color: '#5b7a4d' },
            { name: 'Скелет', hp: 24, atk: 7, xp: 40, color: '#9a9a9a' },
            { name: 'Демон', hp: 34, atk: 10, xp: 70, color: '#b04040' }
        ];

        const BOSS = { name: 'Владыка Бездны', hp: 70, atk: 12, xp: 200, boss: true, phase: 1 };

        // Игровое состояние
        let state = {
            classType: 'warrior',
            level: 1,
            exp: 0,
            hp: 38,
            maxHp: 38,
            mp: 12,
            maxMp: 12,
            attack: 8,
            defense: 3,
            inventory: ['🧪 Зелье', '🧪 Зелье', '🧪 Зелье', '🗡️ Стальной меч', '🛡️ Кожаная броня'],
            floor: 1,
            enemies: [], // текущие враги на комнате 
            currentEnemy: null,
            inCombat: false,
            roomCleared: false,
            // карта комнат: 0 - пусто, 1 - комната, 2 - коридор
            mapGrid: [[1,2,1,2,1],[2,0,2,0,2],[1,2,1,2,1],[2,0,2,0,2],[1,2,1,2,1]],
            playerPos: {x:2, y:2},
            bossDefeated: false,
            turnCounter: 0,
        };

        // элементы
        const $ = id => document.getElementById(id);
        const renderZone = $('renderZone');
        const minimapDiv = $('minimap');
        const gameMsg = $('gameMessage');
        const combatLog = $('combatLog');
        const enemyCard = $('enemyCard');
        const inventoryList = $('inventoryList');
        const levelVal = $('levelVal');
        const expVal = $('expVal');
        const classVal = $('classVal');
        const hpBar = $('hpBar');
        const mpBar = $('mpBar');
        const hpText = $('hpText');
        const mpText = $('mpText');
        const floorBadge = $('floorBadge');
        const attackBtn = $('attackBtn');
        const exploreBtn = $('exploreBtn');
        const potionBtn = $('potionBtn');
        const restBtn = $('restBtn');

        // звук (Web Audio)
        let audioCtx;
        function playTone(freq=200, dur=0.1, type='square', vol=0.03) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + dur);
            } catch(e) {}
        }

        // ================= УТИЛИТЫ =================
        function log(msg) {
            const div = document.createElement('div');
            div.textContent = msg;
            combatLog.prepend(div);
            if (combatLog.children.length > 15) combatLog.removeChild(combatLog.lastChild);
        }

        function updateUI() {
            // stats
            levelVal.textContent = state.level;
            expVal.textContent = `${state.exp}/${state.level * 100}`;
            classVal.textContent = CLASS_DATA[state.classType].name;
            hpBar.style.width = `${(state.hp / state.maxHp) * 100}%`;
            mpBar.style.width = `${(state.mp / state.maxMp) * 100}%`;
            hpText.textContent = `${Math.floor(state.hp)}/${state.maxHp}`;
            mpText.textContent = `${Math.floor(state.mp)}/${state.maxMp}`;
            floorBadge.textContent = `Этаж ${state.floor}`;

            // инвентарь
            inventoryList.innerHTML = state.inventory.map(item => `<span class="inv-item">${item}</span>`).join('');

            // враг
            if (state.currentEnemy) {
                const e = state.currentEnemy;
                enemyCard.innerHTML = `<div style="font-size:1.4rem;">👹 ${e.name}</div>
                    <div class="enemy-hp"><div class="enemy-hp-fill" style="width:${(e.hp/e.maxHp)*100}%; background:${e.color || '#b33e3e'}"></div></div>
                    <div style="font-size:0.8rem;">АТК: ${e.atk} | HP: ${e.hp}/${e.maxHp}</div>`;
                if (e.boss) enemyCard.innerHTML += '<div style="color:#c99;">⚠️ ФАЗА 1</div>';
            } else {
                enemyCard.innerHTML = '— нет врага —';
            }
            // мини-карта
            minimapDiv.innerHTML = '';
            for (let y=0; y<5; y++) {
                for (let x=0; x<5; x++) {
                    const cell = document.createElement('div');
                    if (state.mapGrid[y] && state.mapGrid[y][x] === 1) cell.className = 'room';
                    else if (state.mapGrid[y] && state.mapGrid[y][x] === 2) cell.className = 'corridor';
                    if (state.playerPos.x === x && state.playerPos.y === y) cell.classList.add('player');
                    if (state.currentEnemy && state.enemies.some(e => e.x === x && e.y === y)) cell.classList.add('enemy');
                    minimapDiv.appendChild(cell);
                }
            }
        }

        // генерация комнаты (враги)
        function generateRoom() {
            const enemyCount = 1 + Math.floor(Math.random() * 2);
            state.enemies = [];
            for (let i=0; i<enemyCount; i++) {
                let template;
                if (Math.random() < 0.2 && state.floor >= 2) template = BOSS;
                else template = ENEMY_TYPES[Math.floor(Math.random() * ENEMY_TYPES.length)];
                const enemy = {
                    name: template.name,
                    hp: template.hp + state.floor * 2,
                    maxHp: template.hp + state.floor * 2,
                    atk: template.atk + Math.floor(state.floor * 1.2),
                    xp: template.xp,
                    boss: !!template.boss,
                    color: template.color,
                    x: 1 + Math.floor(Math.random()*3),
                    y: 1 + Math.floor(Math.random()*3)
                };
                state.enemies.push(enemy);
            }
            state.currentEnemy = state.enemies[0];
            state.roomCleared = false;
            state.inCombat = true;
            gameMsg.textContent = '⚠️ В комнате монстры!';
            playTone(100, 0.2, 'sawtooth', 0.05);
            updateUI();
        }

        // перемещение (исследование)
        function explore() {
            if (state.inCombat) {
                log('Сначала разберись с врагами!');
                playTone(80,0.1);
                return;
            }
            // двигаемся случайно
            const dx = Math.floor(Math.random()*3)-1;
            const dy = Math.floor(Math.random()*3)-1;
            let nx = state.playerPos.x + dx;
            let ny = state.playerPos.y + dy;
            nx = Math.max(0, Math.min(4, nx));
            ny = Math.max(0, Math.min(4, ny));
            state.playerPos = {x:nx, y:ny};
            // 30% шанс боя
            if (Math.random() < 0.6) {
                generateRoom();
            } else {
                gameMsg.textContent = 'Ты идёшь по тёмным коридорам...';
                state.inCombat = false;
                state.currentEnemy = null;
                playTone(220,0.1,'sine',0.02);
            }
            updateUI();
            renderDungeon();
        }

        // бой: атака
        function attack() {
            if (!state.inCombat || !state.currentEnemy) {
                log('Нет врага рядом.');
                return;
            }
            const enemy = state.currentEnemy;
            const dmg = Math.max(1, state.attack + Math.floor(Math.random()*4) - 2);
            enemy.hp -= dmg;
            playTone(400, 0.1, 'triangle', 0.06);
            log(`⚔️ Вы нанесли ${dmg} урона ${enemy.name}!`);
            if (enemy.hp <= 0) {
                // победа
                state.exp += enemy.xp;
                log(`💀 ${enemy.name} повержен! +${enemy.xp} опыта.`);
                playTone(800, 0.2, 'sine', 0.05);
                // убрать врага
                state.enemies = state.enemies.filter(e => e !== enemy);
                state.currentEnemy = state.enemies[0] || null;
                if (!state.currentEnemy) {
                    state.inCombat = false;
                    state.roomCleared = true;
                    gameMsg.textContent = 'Комната очищена. Можно идти дальше.';
                    checkLevelUp();
                }
                // босс фаза?
                if (enemy.boss && enemy.phase === 1) {
                    enemy.phase = 2;
                    enemy.hp = 40;
                    enemy.maxHp = 40;
                    enemy.atk += 5;
                    log('⚠️ Босс меняет фазу!');
                    state.currentEnemy = enemy;
                    state.enemies = [enemy];
                }
                updateUI();
                renderDungeon();
                return;
            }
            // ответный удар
            const enemyDmg = Math.max(1, enemy.atk - state.defense + Math.floor(Math.random()*3));
            state.hp -= enemyDmg;
            playTone(150,0.15,'square',0.05);
            log(`👹 ${enemy.name} атакует вас на ${enemyDmg}!`);
            if (state.hp <= 0) {
                state.hp = 0;
                log('💀 Вы погибли... но тьма возвращает вас.');
                state.hp = Math.floor(state.maxHp * 0.5);
                state.mp = state.maxMp;
                // сброс боя
                state.enemies = [];
                state.currentEnemy = null;
                state.inCombat = false;
                gameMsg.textContent = 'Вы возродились у входа.';
                playTone(60,0.5,'sawtooth',0.05);
            }
            checkLevelUp();
            updateUI();
            renderDungeon();
        }

        function checkLevelUp() {
            const expNeed = state.level * 100;
            while (state.exp >= expNeed) {
                state.exp -= expNeed;
                state.level++;
                state.maxHp += 8;
                state.maxMp += 4;
                state.attack += 2;
                state.defense += 1;
                state.hp = state.maxHp;
                state.mp = state.maxMp;
                log(`⬆️ Уровень повышен! Новый уровень: ${state.level}`);
                playTone(1200,0.3,'sine',0.04);
            }
        }

        function usePotion() {
            const idx = state.inventory.indexOf('🧪 Зелье');
            if (idx === -1) { log('Нет зелий!'); return; }
            state.inventory.splice(idx, 1);
            state.hp = Math.min(state.maxHp, state.hp + 20);
            state.mp = Math.min(state.maxMp, state.mp + 10);
            log('🧪 Вы выпили зелье: +20 HP, +10 MP');
            playTone(600,0.2,'sine',0.04);
            // враг может ударить
            if (state.currentEnemy && state.inCombat) {
                const e = state.currentEnemy;
                const dmg = Math.max(1, e.atk - state.defense + 2);
                state.hp -= dmg;
                log(`👹 ${e.name} атакует: -${dmg} HP`);
            }
            if (state.hp <= 0) {
                state.hp = Math.floor(state.maxHp * 0.5);
                log('Вы едва живы...');
            }
            updateUI();
            renderDungeon();
        }

        function rest() {
            if (state.inCombat) { log('Нельзя отдыхать в бою!'); return; }
            state.hp = Math.min(state.maxHp, state.hp + 8);
            state.mp = Math.min(state.maxMp, state.mp + 5);
            log('✨ Вы отдыхаете. HP+8, MP+5');
            if (Math.random() < 0.3) {
                generateRoom();
                gameMsg.textContent = 'Отдых прерван врагами!';
            }
            playTone(300,0.3,'sine',0.02);
            updateUI();
            renderDungeon();
        }

        // отрисовка подземелья упрощённая
        function renderDungeon() {
            renderZone.innerHTML = '';
            // комнаты и коридоры
            for (let y=0; y<5; y++) {
                for (let x=0; x<5; x++) {
                    const cell = document.createElement('div');
                    cell.style.position = 'absolute';
                    cell.style.width = '60px';
                    cell.style.height = '60px';
                    cell.style.left = `${x * 70 + 10}px`;
                    cell.style.top = `${y * 70 + 10}px`;
                    cell.style.background = state.mapGrid[y][x] === 1 ? '#3d352a' : (state.mapGrid[y][x] === 2 ? '#2c303c' : '#0d0f14');
                    cell.style.border = '1px solid #504533';
                    cell.style.borderRadius = '12px';
                    cell.style.boxShadow = 'inset 0 0 10px #00000066';
                    cell.style.display = 'flex';
                    cell.style.alignItems = 'center';
                    cell.style.justifyContent = 'center';
                    if (state.playerPos.x === x && state.playerPos.y === y) {
                        cell.textContent = '🧙';
                        cell.style.fontSize = '26px';
                        cell.style.background = '#4a4238';
                    }
                    if (state.enemies && state.enemies.some(e => e.x === x && e.y === y)) {
                        cell.textContent = '👹';
                        cell.style.fontSize = '24px';
                    }
                    renderZone.appendChild(cell);
                }
            }
            // подсветка комнат (эффект освещения)
            renderZone.style.background = '#0a0c10';
            renderZone.style.boxShadow = 'inset 0 0 60px #1a1e2c';
        }

        // ================= СОХРАНЕНИЕ =================
        function saveGame() {
            localStorage.setItem('dungeonHeroSave', JSON.stringify(state));
            log('💾 Игра сохранена.');
            playTone(500,0.1,'sine',0.03);
        }
        function loadGame() {
            const data = localStorage.getItem('dungeonHeroSave');
            if (data) {
                state = JSON.parse(data);
                // восстановить ссылки
                state.inCombat = !!state.currentEnemy;
                updateUI();
                renderDungeon();
                log('📂 Загрузка успешна.');
                playTone(700,0.1);
            } else log('Нет сохранения.');
        }

        // ================= ИНИЦИАЛИЗАЦИЯ =================
        function setClass(cls) {
            state.classType = cls;
            const d = CLASS_DATA[cls];
            state.maxHp = d.hp;
            state.hp = d.hp;
            state.maxMp = d.mp;
            state.mp = d.mp;
            state.attack = d.atk;
            state.defense = d.def;
            state.level = 1;
            state.exp = 0;
            state.inventory = ['🧪 Зелье','🧪 Зелье','🧪 Зелье','🗡️ Стальной меч','🛡️ Кожаная броня'];
            state.currentEnemy = null;
            state.enemies = [];
            state.inCombat = false;
            state.floor = 1;
            state.playerPos = {x:2,y:2};
            state.mapGrid = [[1,2,1,2,1],[2,0,2,0,2],[1,2,1,2,1],[2,0,2,0,2],[1,2,1,2,1]];
            gameMsg.textContent = `Класс: ${d.name}. В путь!`;
            document.querySelectorAll('.class-btn').forEach(b=>b.classList.remove('active'));
            document.querySelector(`[data-class="${cls}"]`).classList.add('active');
            log(`⚔️ Вы выбрали класс: ${d.name}`);
            updateUI();
            renderDungeon();
            playTone(300,0.2,'triangle',0.03);
        }

        // события
        document.querySelectorAll('.class-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const cls = e.target.dataset.class;
                setClass(cls);
            });
        });
        exploreBtn.addEventListener('click', explore);
        attackBtn.addEventListener('click', attack);
        potionBtn.addEventListener('click', usePotion);
        restBtn.addEventListener('click', rest);
        $('saveBtn').addEventListener('click', saveGame);
        $('loadBtn').addEventListener('click', loadGame);
        window.addEventListener('load', () => {
            setClass('warrior');
            renderDungeon();
        });
    })();
</script>
</body>
</html>
