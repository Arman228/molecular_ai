<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌍 Эволюция планеты — полный симулятор</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0a0f1e;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            color: #c0d0e0;
        }
        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Canvas 3D (планета) */
        #globeCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            background: radial-gradient(circle at 30% 30%, #1a2a3a, #0a0f1e);
            z-index: 1;
        }
        /* UI панель (поверх) */
        .ui-panel {
            position: absolute;
            z-index: 10;
            background: rgba(10, 20, 30, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid #3a4a5a;
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            color: #e0f0ff;
            font-size: 12px;
            pointer-events: auto;
        }
        #controls {
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            max-width: 60%;
            background: rgba(10, 20, 30, 0.8);
        }
        #controls button {
            background: #1e3a5a;
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        #controls button:hover {
            background: #2a5a8a;
            transform: scale(1.02);
        }
        #info {
            top: 20px;
            left: 20px;
            min-width: 200px;
            background: rgba(10, 20, 30, 0.75);
        }
        #info h3 {
            color: #7ec8ff;
            margin-bottom: 5px;
            font-size: 14px;
            border-bottom: 1px solid #3a5a7a;
            padding-bottom: 4px;
        }
        #timeline {
            top: 20px;
            right: 20px;
            background: rgba(10, 20, 30, 0.75);
            min-width: 160px;
            text-align: center;
        }
        #timeline .epoch {
            font-size: 16px;
            font-weight: bold;
            color: #ffcc80;
        }
        #charts {
            bottom: 20px;
            right: 20px;
            background: rgba(10, 20, 30, 0.8);
            width: 200px;
            height: 100px;
            display: flex;
            align-items: end;
            justify-content: space-around;
            padding: 8px;
        }
        .bar {
            width: 30px;
            background: linear-gradient(to top, #4a9eff, #7ec8ff);
            border-radius: 6px 6px 0 0;
            height: 20%;
            transition: height 0.5s ease;
        }
        #interactiveMap {
            top: 70px;
            right: 20px;
            background: rgba(10, 20, 30, 0.7);
            width: 180px;
            height: 180px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #3a6a9a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #b0d0ff;
            cursor: zoom-in;
            transition: all 0.3s;
        }
        #interactiveMap:hover {
            transform: scale(1.1);
            border-color: #9ad0ff;
        }
        #zoomInd {
            position: absolute;
            left: 50%;
            bottom: 80px;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 5;
            pointer-events: none;
        }
        /* Стили для графиков и мини-карты */
        .mini-map {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1a4a7a, #0a2a4a);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 2px;
        }
        .pixel {
            width: 6%;
            height: 6%;
            background: #2a6a9a;
            border-radius: 2px;
            opacity: 0.7;
        }
        /* Адаптивность */
        @media (max-width: 700px) {
            #controls { max-width: 100%; bottom: 10px; left: 10px; }
            #info { top: 10px; left: 10px; min-width: 150px; }
            #timeline { top: 10px; right: 10px; }
            #charts { bottom: 10px; right: 10px; width: 140px; }
            #interactiveMap { top: 60px; right: 10px; width: 120px; height: 120px; }
        }
    </style>
</head>
<body>
<div id="app">
    <!-- 3D Canvas placeholder -->
    <canvas id="globeCanvas"></canvas>
    <!-- UI элементы -->
    <div id="info" class="ui-panel">
        <h3>🌍 Эволюция</h3>
        <div>🦠 Бактерии: <span id="bacteria">1200</span></div>
        <div>🌿 Растения: <span id="plants">340</span></div>
        <div>🐾 Животные: <span id="animals">89</span></div>
        <div>🧠 Разум: <span id="sapient">2</span></div>
        <hr style="border-color:#3a5a7a; margin: 6px 0;">
        <div>⚔️ Войн: <span id="wars">0</span></div>
        <div>🛸 Колоний: <span id="colonies">0</span></div>
        <div>📜 Языков: <span id="langs">3</span></div>
    </div>
    <div id="timeline" class="ui-panel">
        <div style="font-size:11px; opacity:0.8;">⏳ Эпоха</div>
        <div class="epoch" id="epochName">Хадей</div>
        <div style="font-size:11px; margin-top:4px;">🌡️ +<span id="temp">15</span>°C</div>
    </div>
    <div id="charts" class="ui-panel">
        <div class="bar" id="barTech" style="height:10%;"></div>
        <div class="bar" id="barCulture" style="height:20%;"></div>
        <div class="bar" id="barBio" style="height:40%;"></div>
    </div>
    <div id="interactiveMap" class="ui-panel">
        <div class="mini-map" id="miniMap">
            <!-- генерируется -->
        </div>
    </div>
    <div id="controls" class="ui-panel">
        <button id="btnPause">⏸️ Пауза</button>
        <button id="btnFast">⏩ 2x</button>
        <button id="btnSuper">⚡ 5x</button>
        <button id="btnSave">💾 Сохранить</button>
        <button id="btnLoad">📂 Загрузить</button>
        <button id="btnSound">🔊 Звук</button>
    </div>
    <div id="zoomInd">🔍 Зум: 1.0 (колесо мыши)</div>
</div>

<script>
    // ========== ПОЛНЫЙ СИМУЛЯТОР "ЭВОЛЮЦИЯ ПЛАНЕТЫ" ==========
    // ========== 1. Генерация планеты с тектоникой (имитация) ==========
    // ========== 2. Климат, осадки, ветра, течения (упрощённая модель) ==========
    // ========== 3. Эволюция жизни (бактерии → разум) ==========
    // ========== 4. Экосистемы и пищевые цепи ==========
    // ========== 5. Цивилизации (10 этапов) ==========
    // ========== 6-9. Культуры, религии, языки, войны, технологии ==========
    // ========== 10. Космическая экспансия ==========
    // ========== 11. Визуализация 3D (псевдо-3D через Canvas 2D + имитация) ==========
    // ========== 12. Управление временем ==========
    // ========== 13. Сохранение/загрузка ==========
    // ========== 14. Интерактивная карта с зумом (мини-карта) ==========
    // ========== 15. UI с графиками ==========
    // ========== 16. Адаптивность, 17. Звук (WebAudio) ==========

    // --- Глобальные переменные состояния ---
    const state = {
        time: 0, // млн лет
        paused: false,
        speed: 1,
        // планета
        continents: 3, // плиты
        temp: 15,
        precipitation: 50,
        wind: 10,
        oceans: 70,
        // жизнь
        bacteria: 1200,
        plants: 340,
        animals: 89,
        sapient: 0,
        // цивилизации
        civLevel: 0, // 0-10+
        cultures: 1,
        religions: 1,
        languages: ['Прото-язык'],
        wars: 0,
        techLevel: 0, // 0-100+
        colonies: 0,
        // флаги
        soundOn: true,
        zoom: 1.0,
        // для UI
        epochNames: ['Хадей', 'Архей', 'Протерозой', 'Фанерозой', 'Палеозой', 'Мезозой', 'Кайнозой', 'Антропоцен', 'Космическая эра', 'Галактическая'],
    };

    // --- 3D Визуализация (имитация вращающегося шара) ---
    const canvas = document.getElementById('globeCanvas');
    const ctx = canvas.getContext('2d');
    let angle = 0;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- Мини-карта (интерактивная) ---
    function renderMiniMap() {
        const mapDiv = document.getElementById('miniMap');
        mapDiv.innerHTML = '';
        const size = 60; // пикселей
        for (let i = 0; i < 60; i++) {
            const pixel = document.createElement('div');
            pixel.className = 'pixel';
            // имитация континентов и океанов
            if (Math.random() > 0.65) pixel.style.background = '#3a7a3a'; // суша
            else pixel.style.background = '#1a4a7a'; // океан
            mapDiv.appendChild(pixel);
        }
    }
    renderMiniMap();

    // --- Звуковое сопровождение (генерация простых сигналов) ---
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }
    function playEvolveSound() {
        if (!state.soundOn) return;
        try {
            initAudio();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.frequency.value = 400 + Math.random() * 600;
            oscillator.type = 'sine';
            gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.2);
        } catch(e) {}
    }

    // --- Сохранение и загрузка ---
    function saveGame() {
        localStorage.setItem('evolutionWorld', JSON.stringify(state));
        alert('💾 Сохранено!');
    }
    function loadGame() {
        const data = localStorage.getItem('evolutionWorld');
        if (data) {
            Object.assign(state, JSON.parse(data));
            renderMiniMap();
            updateUI();
            alert('📂 Загружено!');
        } else alert('Нет сохранения.');
    }

    // --- Обновление UI и графиков ---
    function updateUI() {
        document.getElementById('bacteria').textContent = state.bacteria;
        document.getElementById('plants').textContent = state.plants;
        document.getElementById('animals').textContent = state.animals;
        document.getElementById('sapient').textContent = state.sapient;
        document.getElementById('wars').textContent = state.wars;
        document.getElementById('colonies').textContent = state.colonies;
        document.getElementById('langs').textContent = state.languages.length;
        document.getElementById('temp').textContent = Math.round(state.temp);
        document.getElementById('epochName').textContent = state.epochNames[Math.min(Math.floor(state.time / 100), state.epochNames.length-1)];
        // бары (технологии, культура, биоразнообразие)
        document.getElementById('barTech').style.height = Math.min(100, state.techLevel * 1.2) + '%';
        document.getElementById('barCulture').style.height = Math.min(100, (state.cultures + state.religions) * 10) + '%';
        document.getElementById('barBio').style.height = Math.min(100, (state.bacteria + state.plants + state.animals) / 20) + '%';
        // мини-карта обновление уже отдельно
    }

    // --- Симуляция эволюции (основной цикл) ---
    function simulateStep() {
        if (state.paused) return;
        // Ускорение времени
        state.time += 0.1 * state.speed;

        // 1. Тектоника: континенты двигаются (меняем климат)
        state.temp = 15 + Math.sin(state.time * 0.02) * 5;
        state.precipitation = 50 + Math.cos(state.time * 0.01) * 20;
        state.wind = 10 + Math.sin(state.time * 0.03) * 5;

        // 2. Эволюция жизни (экспоненциальный рост)
        if (state.time > 5) { // архей
            state.bacteria += Math.floor(Math.random() * 20 + 5 * state.speed);
            state.plants += Math.floor(Math.random() * 10 * state.speed);
            state.animals += Math.floor(Math.random() * 5 * state.speed);
        }
        if (state.time > 20 && state.animals > 50) {
            state.sapient = Math.min(5, Math.floor(state.time / 50) + 1);
        }

        // 3. Цивилизация: этапы (0-10)
        if (state.sapient > 0) {
            const newLevel = Math.min(10, Math.floor(state.time / 50));
            if (newLevel > state.civLevel) {
                state.civLevel = newLevel;
                // войны, языки, культуры
                state.wars += state.civLevel > 3 ? 1 : 0;
                if (state.civLevel > 2) {
                    state.languages.push('Язык-' + state.civLevel);
                }
                state.cultures += 1;
                state.religions += 1;
                state.techLevel = Math.min(100, state.techLevel + 5 + state.civLevel * 2);
                playEvolveSound();
            }
            // космическая экспансия
            if (state.civLevel >= 8) {
                state.colonies = Math.floor((state.civLevel - 7) * 2);
            }
        }

        // 4. Пищевые цепи: хищники/травоядные (простые колебания)
        const predator = Math.floor(state.animals * 0.3);
        const prey = state.animals - predator;
        if (prey > 20 && predator > 10) {
            state.animals -= Math.floor(Math.random() * 3);
        }

        // 5. Технологии растут
        if (state.civLevel > 0) {
            state.techLevel = Math.min(100, state.techLevel + 0.1 * state.speed);
        }

        // 6. Ограничение роста
        state.bacteria = Math.min(5000, state.bacteria);
        state.plants = Math.min(2000, state.plants);
        state.animals = Math.min(500, state.animals);

        updateUI();
        renderMiniMap();
    }

    // --- Отрисовка 3D (псевдо-планета) ---
    function drawGlobe() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const radius = Math.min(canvas.width, canvas.height) * 0.3 * state.zoom;

        // Атмосфера (градиент)
        const grad = ctx.createRadialGradient(cx-20, cy-20, radius*0.3, cx, cy, radius*1.2);
        grad.addColorStop(0, '#2a5a8a');
        grad.addColorStop(0.6, '#1a3a5a');
        grad.addColorStop(1, '#0a1a2a');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, radius*1.2, 0, Math.PI*2);
        ctx.fill();

        // Планета (суша+океан)
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 30;
        const grad2 = ctx.createRadialGradient(cx-10, cy-10, 10, cx, cy, radius);
        grad2.addColorStop(0, '#3a7a5a'); // суша
        grad2.addColorStop(0.7, '#2a5a7a'); // океан
        ctx.fillStyle = grad2;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Континенты (двигаются за счёт угла)
        ctx.fillStyle = '#4a8a4a';
        ctx.globalAlpha = 0.7;
        for (let i = 0; i < 5; i++) {
            const offX = Math.sin(angle + i * 1.5) * radius * 0.2;
            const offY = Math.cos(angle * 0.7 + i * 2) * radius * 0.2;
            ctx.beginPath();
            ctx.arc(cx + offX, cy + offY, radius*0.15, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.globalAlpha = 1.0;

        // Облака/осадки
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath();
        ctx.arc(cx-20, cy-30, radius*0.2, 0, Math.PI*2);
        ctx.fill();

        // Текстовое обозначение
        ctx.font = 'bold 14px monospace';
        ctx.fillStyle = '#c0e0ff';
        ctx.shadowColor = 'black';
        ctx.shadowBlur = 4;
        ctx.fillText('⏳ ' + Math.floor(state.time) + ' млн лет', 20, 40);
        ctx.shadowBlur = 0;

        angle += 0.002 * state.speed; // вращение
        requestAnimationFrame(drawGlobe);
    }

    // --- Управление временем, UI события ---
    document.getElementById('btnPause').addEventListener('click', () => {
        state.paused = !state.paused;
        document.getElementById('btnPause').textContent = state.paused ? '▶️ Пуск' : '⏸️ Пауза';
    });
    document.getElementById('btnFast').addEventListener('click', () => { state.speed = 2; });
    document.getElementById('btnSuper').addEventListener('click', () => { state.speed = 5; });
    document.getElementById('btnSave').addEventListener('click', saveGame);
    document.getElementById('btnLoad').addEventListener('click', loadGame);
    document.getElementById('btnSound').addEventListener('click', () => {
        state.soundOn = !state.soundOn;
        document.getElementById('btnSound').textContent = state.soundOn ? '🔊 Звук' : '🔇 Тишина';
    });

    // Интерактивный зум: колесо мыши на canvas
    canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        state.zoom += e.deltaY < 0 ? 0.1 : -0.1;
        state.zoom = Math.min(2.0, Math.max(0.5, state.zoom));
        document.getElementById('zoomInd').textContent = '🔍 Зум: ' + state.zoom.toFixed(1);
    });

    // --- Адаптивность (карта) ---
    window.addEventListener('resize', () => {
        renderMiniMap();
    });

    // --- Инициализация и запуск ---
    function init() {
        // начальная генерация языков
        state.languages = ['Прото-язык', 'Древний'];
        // стартовый климат
        state.temp = 15;
        updateUI();
        renderMiniMap();
        // основной цикл симуляции (каждые 100 мс)
        setInterval(simulateStep, 100);
        // отрисовка 3D
        drawGlobe();
        // фоновый звук (короткий сигнал при старте)
        setTimeout(() => playEvolveSound(), 500);
    }

    init();
</script>
</body>
</html>
