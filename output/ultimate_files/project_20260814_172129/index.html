<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма с валидацией и стилями</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0e5ec, #f5f7fa);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px 35px;
            width: 100%;
            max-width: 520px;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        h2 {
            font-size: 28px;
            font-weight: 700;
            color: #1a2b3c;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #6b7a8f;
            font-size: 15px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e9edf2;
            padding-bottom: 15px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: #2c3e50;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        label .required {
            color: #e74c3c;
            margin-left: 4px;
        }

        input, textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #dde3e9;
            border-radius: 12px;
            font-size: 15px;
            background-color: #f8fafc;
            transition: all 0.2s ease;
            font-family: inherit;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #4a90d9;
            background: white;
            box-shadow: 0 0 0 4px rgba(74, 144, 217, 0.15);
        }

        input.error, textarea.error {
            border-color: #e74c3c;
            background: #fff5f5;
        }

        input.error:focus, textarea.error:focus {
            box-shadow: 0 0 0 4px rgba(231, 76, 60, 0.15);
            border-color: #e74c3c;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .error-message {
            font-size: 13px;
            color: #e74c3c;
            margin-top: 6px;
            display: none;
            font-weight: 500;
        }

        .error-message.visible {
            display: block;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0 20px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #4a90d9;
            margin: 0;
        }

        .checkbox-group label {
            margin: 0;
            font-weight: 500;
            font-size: 15px;
            color: #34495e;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(145deg, #4a90d9, #357abd);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.5px;
            margin-top: 5px;
            box-shadow: 0 5px 15px rgba(74, 144, 217, 0.3);
        }

        .btn:hover {
            background: linear-gradient(145deg, #357abd, #2a6aa8);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 144, 217, 0.35);
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: 0 3px 10px rgba(74, 144, 217, 0.2);
        }

        .success-message {
            display: none;
            background: #eafaf1;
            border-left: 5px solid #27ae60;
            color: #1e8449;
            padding: 15px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
            font-size: 15px;
        }

        .success-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>📋 Регистрация</h2>
        <div class="subtitle">Заполните форму — все поля обязательны</div>

        <div class="success-message" id="successMessage">
            ✅ Спасибо! Форма успешно отправлена.
        </div>

        <form id="myForm" novalidate>
            <div class="form-group">
                <label for="name">Имя <span class="required">*</span></label>
                <input type="text" id="name" placeholder="Например, Иван" autocomplete="off">
                <div class="error-message" id="nameError">Пожалуйста, введите имя (минимум 2 символа)</div>
            </div>

            <div class="form-group">
                <label for="email">Email <span class="required">*</span></label>
                <input type="email" id="email" placeholder="example@mail.com" autocomplete="off">
                <div class="error-message" id="emailError">Введите корректный email (например, test@mail.ru)</div>
            </div>

            <div class="form-group">
                <label for="phone">Телефон <span class="required">*</span></label>
                <input type="tel" id="phone" placeholder="+7 (___) ___-__-__" autocomplete="off">
                <div class="error-message" id="phoneError">Введите номер в формате: +7 (XXX) XXX-XX-XX</div>
            </div>

            <div class="form-group">
                <label for="message">Сообщение <span class="required">*</span></label>
                <textarea id="message" placeholder="Введите ваше сообщение (не менее 10 символов)"></textarea>
                <div class="error-message" id="messageError">Сообщение должно быть не менее 10 символов</div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="agree">
                <label for="agree">Я согласен с условиями обработки данных</label>
            </div>
            <div class="error-message" id="agreeError" style="margin-top: -10px; margin-bottom: 10px;">Необходимо согласие</div>

            <button type="submit" class="btn">Отправить форму</button>
        </form>
    </div>

    <script>
        (function() {
            const form = document.getElementById('myForm');
            const nameInput = document.getElementById('name');
            const emailInput = document.getElementById('email');
            const phoneInput = document.getElementById('phone');
            const messageInput = document.getElementById('message');
            const agreeCheckbox = document.getElementById('agree');

            const nameError = document.getElementById('nameError');
            const emailError = document.getElementById('emailError');
            const phoneError = document.getElementById('phoneError');
            const messageError = document.getElementById('messageError');
            const agreeError = document.getElementById('agreeError');

            const successMessage = document.getElementById('successMessage');

            // Вспомогательная функция для отображения ошибок
            function setError(input, errorElement, hasError) {
                if (hasError) {
                    input.classList.add('error');
                    errorElement.classList.add('visible');
                } else {
                    input.classList.remove('error');
                    errorElement.classList.remove('visible');
                }
            }

            // Валидация имени (минимум 2 буквы)
            function validateName() {
                const value = nameInput.value.trim();
                const isValid = value.length >= 2;
                setError(nameInput, nameError, !isValid);
                return isValid;
            }

            // Валидация email с регулярным выражением
            function validateEmail() {
                const value = emailInput.value.trim();
                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                const isValid = emailPattern.test(value);
                setError(emailInput, emailError, !isValid);
                return isValid;
            }

            // Валидация телефона: +7 (XXX) XXX-XX-XX или +7XXXXXXXXXX (упрощённо)
            function validatePhone() {
                let value = phoneInput.value.trim();
                // Удаляем все пробелы, дефисы, скобки для проверки
                const digitsOnly = value.replace(/[\s\-()]/g, '');
                // Проверяем: начинается с +7 и содержит 10 цифр после (всего 12 символов с +)
                const isValid = /^\+7\d{10}$/.test(digitsOnly) && value.includes('+7');
                setError(phoneInput, phoneError, !isValid);
                return isValid;
            }

            // Валидация сообщения (минимум 10 символов)
            function validateMessage() {
                const value = messageInput.value.trim();
                const isValid = value.length >= 10;
                setError(messageInput, messageError, !isValid);
                return isValid;
            }

            // Валидация чекбокса
            function validateAgree() {
                const isValid = agreeCheckbox.checked;
                agreeError.classList.toggle('visible', !isValid);
                return isValid;
            }

            // Сброс ошибок при вводе (для удобства)
            nameInput.addEventListener('input', function() {
                if (this.value.trim().length >= 2) {
                    this.classList.remove('error');
                    nameError.classList.remove('visible');
                }
            });

            emailInput.addEventListener('input', function() {
                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (emailPattern.test(this.value.trim())) {
                    this.classList.remove('error');
                    emailError.classList.remove('visible');
                }
            });

            phoneInput.addEventListener('input', function() {
                const digitsOnly = this.value.replace(/[\s\-()]/g, '');
                if (/^\+7\d{10}$/.test(digitsOnly)) {
                    this.classList.remove('error');
                    phoneError.classList.remove('visible');
                }
            });

            messageInput.addEventListener('input', function() {
                if (this.value.trim().length >= 10) {
                    this.classList.remove('error');
                    messageError.classList.remove('visible');
                }
            });

            agreeCheckbox.addEventListener('change', function() {
                if (this.checked) {
                    agreeError.classList.remove('visible');
                }
            });

            // Обработка отправки формы
            form.addEventListener('submit', function(event) {
                event.preventDefault();

                // Скрываем предыдущее сообщение об успехе
                successMessage.classList.remove('show');

                // Запускаем валидацию всех полей
                const isNameValid = validateName();
                const isEmailValid = validateEmail();
                const isPhoneValid = validatePhone();
                const isMessageValid = validateMessage();
                const isAgreeValid = validateAgree();

                // Если все поля валидны — показываем успех
                if (isNameValid && isEmailValid && isPhoneValid && isMessageValid && isAgreeValid) {
                    successMessage.classList.add('show');
                    form.reset(); // очищаем форму

                    // Сбрасываем все стили ошибок (чистим классы)
                    const inputs = form.querySelectorAll('input, textarea');
                    inputs.forEach(input => input.classList.remove('error'));
                    const errors = form.querySelectorAll('.error-message');
                    errors.forEach(error => error.classList.remove('visible'));

                    // Прокрутка к сообщению (визуально приятно)
                    successMessage.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    // Если есть ошибки, фокусируемся на первом невалидном поле
                    if (!isNameValid) {
                        nameInput.focus();
                    } else if (!isEmailValid) {
                        emailInput.focus();
                    } else if (!isPhoneValid) {
                        phoneInput.focus();
                    } else if (!isMessageValid) {
                        messageInput.focus();
                    } else if (!isAgreeValid) {
                        agreeCheckbox.focus();
                    }
                }
            });

            // Дополнительно: маска для телефона (мягкая подсказка)
            phoneInput.addEventListener('input', function(e) {
                let value = this.value.replace(/\D/g, '');
                if (value.startsWith('7')) value = '+7' + value.slice(1);
                else if (value.startsWith('8')) value = '+7' + value.slice(1);
                else value = '+7' + value;

                // Форматирование как +7 (XXX) XXX-XX-XX
                if (value.length > 0) {
                    let digits = value.replace(/\D/g, '');
                    if (digits.length === 0) {
                        this.value = '';
                    } else {
                        let formatted = '+7';
                        if (digits.length > 1) formatted += ' (' + digits.slice(1, 4);
                        if (digits.length >= 4) formatted += ') ' + digits.slice(4, 7);
                        if (digits.length >= 7) formatted += '-' + digits.slice(7, 9);
                        if (digits.length >= 9) formatted += '-' + digits.slice(9, 11);
                        this.value = formatted;
                    }
                }
            });
        })();
    </script>
</body>
</html>
